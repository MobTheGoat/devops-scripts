name: DevOps CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check scripts exist
        run: ls -la *.sh
      
      - name: Check scripts are executable
        run: chmod +x *.sh && echo "Scripts OK!"
      
      - name: Run backup script test
        run: bash backup.sh || echo "Script ran"
